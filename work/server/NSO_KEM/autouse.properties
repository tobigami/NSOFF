# Tự dùng vật phẩm ngay khi đăng nhập. Sửa xong lưu lại là có hiệu lực, không cần khởi động lại
# máy chủ -- tệp được đọc lại mỗi lần có người vào game nếu nó vừa đổi.

# ID vật phẩm, dùng theo đúng thứ tự viết ở đây. Bốn món mặc định là bốn viên đan 10 phút:
#   275 Minh Mẫn Đan    - tăng 500 độ chính xác
#   276 Long Lực Đan    - tăng 500% tấn công cơ bản
#   277 Kháng Thể Đan   - tăng 100 kháng tất cả
#   278 Sinh Mệnh Đan   - tăng 1000 HP
# Với bốn món này máy chủ tự bỏ qua nếu hiệu ứng vẫn còn hạn, nên đăng nhập lại giữa chừng
# không bị phí đồ. Các id khác thì cứ có trong hành trang là dùng.
items = 275,276,277,278

# Để trống là áp dụng cho mọi tài khoản. Muốn giới hạn thì liệt kê, cách nhau bằng dấu phẩy.
accounts =

# Đợi bao nhiêu giây sau khi vào game rồi mới dùng, để máy khách kịp nạp xong bản đồ.
delay = 5

# ID vật phẩm tự xoá khỏi hành trang ngay khi đăng nhập. Để trống là không dọn gì.
#   0 Đá cấp 1   1 Đá cấp 2   2 Đá cấp 3
# Cùng danh sách này dùng cho nút "Dọn ngay" trong màn hình Hành trang.
drop = 0

# Số lượt vào hang động mỗi ngày. Để 1 là giữ nguyên luật gốc của game.
# countPB trong cơ sở dữ liệu là cờ 0/1 chứ không phải bộ đếm, nên máy chủ không đặt thẳng số này
# vào đó mà nạp lại cờ sau mỗi lượt, tối đa bấy nhiêu lần trong ngày.
dungeon.per.day = 100

